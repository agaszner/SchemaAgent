[project]
name = "homework-shemaagent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.156.8",
    "networkx>=3.7",
    "pyvis>=0.3.2",
    "sqlglot>=30.24.0",
    "streamlit>=1.66.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"  # tests/api and tests/ui share file names

[tool.fastapi]
entrypoint = "api.main:app"
